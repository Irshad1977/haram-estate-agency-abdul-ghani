<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plot Cancellation & Refund</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 700px;">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-danger text-white py-3">
            <h5 class="m-0 fw-bold"><i class="fa-solid fa-ban me-2"></i> Plot Booking Cancellation & Refund Voucher</h5>
        </div>
        <div class="card-body p-4">
            
            <!-- Plot Summary -->
            <div class="p-3 bg-light rounded border mb-4">
                <div class="row g-2">
                    <div class="col-6"><strong>Plot No:</strong> #{{ plot.plot_number }} ({{ plot.plot_type }})</div>
                    <div class="col-6"><strong>Owner:</strong> {{ plot.owner_name }}</div>
                    <div class="col-6"><strong>Mobile:</strong> {{ plot.mobile_no }}</div>
                    <div class="col-6"><strong>Total Cost:</strong> Rs. {{ plot.total_cost|accounting }}</div>
                    <div class="col-12 mt-2 pt-2 border-top">
                        <strong class="text-success fs-6">Total Amount Paid So Far: Rs. <span id="total-paid">{{ total_paid }}</span></strong>
                    </div>
                </div>
            </div>

            <!-- Refund Calculation Form -->
            <form action="/cancel-plot/{{ plot.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Select Deduction Percentage</label>
                    <select id="deduction-percent" name="deduction_percent" class="form-select" onchange="calculateRefund()">
                        <option value="10">10% Deduction Policy</option>
                        <option value="20">20% Deduction Policy</option>
                        <option value="15">15% Custom Deduction</option>
                        <option value="0">0% Full Refund (No Deduction)</option>
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label text-muted small fw-bold">DEDUCTION AMOUNT (COMPANY PROFIT)</label>
                        <input type="text" id="deduction-amount" class="form-control text-danger fw-bold" readonly>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-muted small fw-bold">NET REFUNDABLE TO CLIENT</label>
                        <input type="text" id="refund-amount" class="form-control text-success fw-bold fs-5" readonly>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Cancellation Date</label>
                    <input type="date" name="cancel_date" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Cancellation Reason / Remarks</label>
                    <input type="text" name="remarks" class="form-control" placeholder="e.g. Client requested booking withdrawal due to personal reasons">
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
                    <button type="submit" class="btn btn-danger fw-bold px-4" onclick="return confirm('Kya aap yaqeenan yeh booking cancel aur refund karna chahte hain?')">
                        Process Cancellation & Issue Refund
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
    function calculateRefund() {
        const totalPaid = parseFloat(document.getElementById('total-paid').innerText) || 0;
        const percent = parseFloat(document.getElementById('deduction-percent').value) || 0;
        
        const deduction = (totalPaid * percent) / 100.0;
        const netRefund = totalPaid - deduction;

        document.getElementById('deduction-amount').value = 'Rs. ' + deduction.toLocaleString('en-US', {minimumFractionDigits: 1});
        document.getElementById('refund-amount').value = 'Rs. ' + netRefund.toLocaleString('en-US', {minimumFractionDigits: 1});
    }
    calculateRefund();
</script>
</body>
</html>
