<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receive Payment - Housing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 0.85rem; background-color: #f4f6f9; }
        .card-header { padding: 0.5rem 1rem; }
        .form-control, .form-select, .btn { font-size: 0.85rem; padding: 0.3rem 0.6rem; border-radius: 3px; }
        label { margin-bottom: 0.2rem; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container py-3" style="max-width: 700px;">
        <div class="card shadow-sm border-0">
            
            <!-- --- START: Card Header --- -->
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2">
                <span class="fw-bold">Receive Installment Payment</span>
                <a href="{{ url_for('dashboard') }}" class="btn btn-light btn-sm py-0">Back to Dashboard</a>
            </div>
            <!-- --- END: Card Header --- -->

            <div class="card-body p-3">

                <!-- --- START: Flash Messages --- -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show py-2 mb-2" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <!-- --- END: Flash Messages --- -->


                <!-- ======================================================= -->
                <!-- RECEIVE PAYMENT FORM SECTION -->
                <!-- ======================================================= -->
                <!-- --- START: Payment Entry Form --- -->
                <form method="POST" action="{{ url_for('add_installment') }}">
                    <div class="row g-2">
                        
                        <!-- Auto Context Information -->
                        <div class="col-md-6">
                            <label class="form-label">Active Scheme</label>
                            <input type="text" class="form-control bg-light" value="{{ session.get('active_scheme') }}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control bg-light text-uppercase" id="plot_category" name="plot_category" value="{{ default_category }}" readonly>
                        </div>

                        <!-- Target Plot Number -->
                        <div class="col-md-12">
                            <label for="plot_number" class="form-label">Plot Number *</label>
                            <input type="text" class="form-control" id="plot_number" name="plot_number" placeholder="e.g. 101" value="{{ entered_plot_number or '' }}" required>
                        </div>

                        <!-- Payment Amount & Date -->
                        <div class="col-md-6">
                            <label for="amount" class="form-label">Installment Amount *</label>
                            <input type="number" step="any" class="form-control" id="amount" name="amount" placeholder="e.g. 10000" required>
                        </div>
                        <div class="col-md-6">
                            <label for="payment_date" class="form-label">Payment Date *</label>
                            <input type="date" class="form-control" id="payment_date" name="payment_date" required>
                        </div>

                        <!-- Slip Number & Remarks -->
                        <div class="col-md-6">
                            <label for="receipt_no" class="form-label">Receipt / Slip No *</label>
                            <input type="text" class="form-control" id="receipt_no" name="receipt_no" placeholder="e.g. REC-1002" required>
                        </div>

                        <div class="col-md-6">
                            <label for="remarks" class="form-label">Remarks / Description</label>
                            <input type="text" class="form-control" id="remarks" name="remarks" placeholder="Monthly Installment">
                        </div>

                        <!-- Save & Cancel Buttons -->
                        <div class="col-12 mt-3 text-end">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-success px-4">Save Payment</button>
                        </div>

                    </div>
                </form>
                <!-- --- END: Payment Entry Form --- -->

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
